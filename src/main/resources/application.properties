spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-secret=${APP_JWT_REFRESH_SECRET}
app.jwt.refresh-expiration-ms=604800000

# Superadmin
app.superadmin.email=anshuman15b+admin@gmail.com
app.superadmin.password=Hello1234

# Feature Flags
app.features.multi-branch=true
app.features.hotel-module=true

# Jackson Serialization
spring.jackson.serialization.fail-on-empty-beans=false

# File Upload Limits (10MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Cloudinary Integration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Socket.IO Real-Time Server
socketio.host=0.0.0.0
socketio.port=4001

# Email / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# SMTP Security Settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Who the emails appear to be from
app.mail.from.address=anshumanborahh23@gmail.com
app.mail.from.name=Dine&Stay OS

# Razorpay Configuration
razorpay.key.id=rzp_test_TkHhiqtk3UO7wo
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ==========================================
# APACHE KAFKA CONFIGURATION
# ==========================================
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=dinestay-email-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Stop Kafka from freezing the app if the broker is offline
spring.kafka.producer.properties.max.block.ms=1000
# Prevent crash on startup without a cloud broker
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}

frontend.url=${FRONTEND_URL:https://dine-stay-os-frontend.vercel.app}

# ==========================================
# OBSERVABILITY & METRICS
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

spring.application.name=dinestay-backend
management.metrics.tags.application=dinestay-backend
