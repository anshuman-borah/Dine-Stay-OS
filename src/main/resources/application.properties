# Database (Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.jpkhvelgfsuumybrwnkl}
